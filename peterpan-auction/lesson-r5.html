</script></head><body><main id="viewport"><article id="stage" aria-label="课件画面"></article></main><nav id="controls" aria-label="课件导航"><button data-offline-action="help">使用说明</button><span class="version">人生拍卖会 · 教师反馈R5</span><button data-action="prev" aria-label="上一页">←</button><div id="page-tabs"></div><button data-action="next" aria-label="下一页">→</button><button data-action="directory">目录</button><button data-action="notes">教师备注</button><button data-action="reset">重试本页</button><button data-action="present">全屏授课</button><button data-action="review">本页意见</button><button data-action="settings">教师准备</button><a id="theme-link" href="b.html">换蓝版 ↗</a></nav><aside id="notes" hidden></aside><aside id="directory" class="drawer" hidden></aside><aside id="review" class="drawer" hidden></aside><aside id="settings" class="drawer" hidden></aside><dialog id="offline-dialog"><header><strong id="offline-dialog-title"></strong><button data-offline-action="close">关闭 ×</button></header><div id="offline-dialog-content"></div></dialog><nav id="fullscreen-controls" aria-label="全屏课件导航"><button data-action="prev" aria-label="上一页">← 上一页</button><span id="fullscreen-counter"></span><button data-action="next" aria-label="下一页">下一页 →</button><button data-offline-action="exit-fullscreen">退出全屏</button></nav><div id="fullscreen-notice" role="status" aria-live="polite"></div><script>window.COURSE={"version": "HTML v1.4 · 教师反馈R5", "status": "本地离线授课版；未经本场教师试教", "pages": [{"id": 1, "chapter": "入场与情境", "title": "让坚持，\n成为底气", "kind": "cover", "minutes": 2, "lead": "彼得潘 · 表达与选择", "items": ["人生第一场拍卖会", "有声，有主见", "每一次认真与坚持，都值得被看见。"], "ask": "找到你的号码牌。先看，不急着举。", "guide": "签到号码按本班人数1至N发放。在“老师先看这里”选择正确班场，录入每个号码经核定的实得积分，再按实发放实体券。100仅是练习值；150仅为配券备料。", "feedback": "孩子能找到号码、说出一个看到的物件即可。", "nextline": "今天，要把决定交给你。", "displayNumber": 1, "operation": "观察舞台道具；找到号码牌；说出一个看到的物品。", "teacherDemo": "签到号码按本班人数1至N发放。在“老师先看这里”选择正确班场，录入每个号码经核定的实得积分，再按实发放实体券。100仅是练习值；150仅为配券备料。"}, {"id": 2, "chapter": "入场与情境", "title": "今天，你来做决定", "kind": "mission", "minutes": 2, "lead": "带走三件真正属于你的本领", "items": ["说具体：我为什么想选", "听明白：别人是怎样想的", "有主见：继续、停止，都说理由"], "ask": "跟同伴说：今天我想练习……", "guide": "先给15秒思考，再两人各说20秒。接受一个词，邀请补成一句。请两名孩子回应即可，避免本班学生轮流上台占满时间。", "feedback": "不以声音大、出价高作为本领强的证据。", "nextline": "先给家长一个小任务。", "displayNumber": 2, "operation": "依次点开说、听、决定；每一步请一位孩子用动作演示。", "teacherDemo": "先给15秒思考，再两人各说20秒。接受一个词，邀请补成一句。请两名孩子回应即可，避免本班学生轮流上台占满时间。"}, {"id": 3, "chapter": "入场与情境", "title": "爸妈，先听我说", "kind": "parents", "minutes": 1, "lead": "家长今天的任务：听见，而不是代答", "items": ["记下一句原话", "孩子决定时，先等一等", "最后只问一个问题"], "ask": "孩子说完后，再问：你为什么这样想？", "guide": "请家长用观察卡记原话。无人陪同的孩子由协助老师记录。家长代答时说“我们先听孩子说完，稍后请您问一个问题”。", "feedback": "记录真实表达，不写统一的“表现特别棒”。", "nextline": "如果三个东西都喜欢，怎样选？", "displayNumber": 3, "operation": "依次点先等待、记原话、问一个；家长先试着安静等三秒。", "teacherDemo": "请家长用观察卡记原话。无人陪同的孩子由协助老师记录。家长代答时说“我们先听孩子说完，稍后请您问一个问题”。"}, {"id": 4, "chapter": "入场与情境", "title": "都喜欢，就都要吗？", "kind": "story", "minutes": 1, "lead": "小潘拿着100积分币，停在三件物品前。", "items": ["故事本：我想记录自己的故事", "彩铅：朋友说颜色很好看", "拼图：我还不知道怎么玩"], "ask": "先别替小潘选。你还想知道什么？", "guide": "这是虚构练习情境，物品不是正式拍品。由老师分别读出三句想法，只让孩子补“还想知道什么”，不先讲大道理。", "feedback": "孩子可以问玩法、用途、自己已有物品；没有唯一答案。", "nextline": "替小潘作第一次选择。", "art": "writing", "displayNumber": 4, "operation": "切换物品，先猜再点“看看小潘怎么想”；每次切换重新隐藏想法。", "teacherDemo": "这是虚构练习情境，物品不是正式拍品。由老师分别读出三句想法，只让孩子补“还想知道什么”，不先讲大道理。"}, {"id": 5, "chapter": "入场与情境", "title": "先选哪一步？", "kind": "choice", "minutes": 2, "lead": "选择前，你会先做什么？", "items": ["马上举牌，别人都喜欢", "问清玩法，再想自己是否需要", "先看看，暂时不决定"], "ask": "点一个考虑，再说出你的理由。", "guide": "允许学生举手表达，由老师点按钮。先听原因再打开反馈；选“马上举”也不嘲笑，追问是否了解物品。", "feedback": "判断的是考虑有没有说清楚，不把个人偏好打成对错。", "nextline": "认识让选择顺利进行的工具。", "answers": ["你已经注意到同伴的兴趣。还想核实什么？如果别人不选，你仍想怎样用它？", "问清用途能帮助决定。你准备问哪一个具体问题？请试着说出来。", "观察也是一个决定。你准备看什么？想清楚后再回来表达。"], "displayNumber": 5, "operation": "学生先选并说明；老师再点反馈；返回后换一种考虑。", "teacherDemo": "允许学生举手表达，由老师点按钮。先听原因再打开反馈；选“马上举”也不嘲笑，追问是否了解物品。"}, {"id": 6, "chapter": "入场与情境", "title": "号码不是金额", "kind": "prop", "minutes": 1, "lead": "这块牌告诉主持人：我是谁。", "items": ["03：我的竞拍编号", "积分币：我的报价", "举牌后：等主持人点到我"], "ask": "请说：我是03号，我准备出……积分币。", "guide": "把实物号码牌举到主持人看得见的位置，不挡同伴。让两名孩子示范“号码”和“金额”，不要求每次报价都长篇说理由。", "feedback": "03是编号；30才是这次报价。号码示例适用于所有班，本场号码上限见教师设置。", "nextline": "接下来先做观察员。", "displayNumber": 6, "operation": "看03号码牌和30报价；点选谁是编号，再说一次完整报价。", "teacherDemo": "把实物号码牌举到主持人看得见的位置，不挡同伴。让两名孩子示范“号码”和“金额”，不要求每次报价都长篇说理由。"}, {"id": 7, "chapter": "观察与理由", "title": "三件物品，三种用途", "kind": "gallery", "minutes": 1, "lead": "练习物品示例 · 不代表最终采购拍品", "items": ["故事本：记录和创作", "彩铅：画出不同颜色", "拼图：观察、组合、合作"], "ask": "你准备把哪一件介绍给别人？", "guide": "现场有实物时优先拿出实物；目前课件使用清楚标注的类别示意。先不公布参考理由，避免孩子照搬老师答案。", "feedback": "只需选一个练习对象，不是提前锁定竞拍资格。", "nextline": "看得具体，才能说得具体。", "displayNumber": 7, "operation": "点击一个物品看用途；返回三物；说一个自己的使用场景。", "teacherDemo": "现场有实物时优先拿出实物；目前课件使用清楚标注的类别示意。先不公布参考理由，避免孩子照搬老师答案。"}, {"id": 8, "chapter": "观察与理由", "title": "先看见，再下结论", "kind": "inspect", "minutes": 3, "lead": "别急着说“好”。先把细节找出来。", "items": ["它叫什么？", "我真的看见了什么？", "它能用来做什么？"], "ask": "点开一个问题，补上你看到的细节。", "guide": "按“名字—特点—用途”逐次点开问题。孩子先指认再说，老师一次只追问一个细节；无法验证的功能说“我们还要核实”。", "feedback": "把“很厉害”接成“哪一个地方让你这样想？”", "nextline": "把看见的细节，接到自己的理由后面。", "art": "writing", "answers": ["可以先说“这是一本记录本”。名字说清，听的人才知道你在介绍谁。", "说一个看得见的特点：有横线、有空白页、封面颜色……不要替物品编功能。", "用途可以不同：记故事、画草图、记录想问的问题。联系自己的需要再解释。"], "displayNumber": 8, "operation": "按名字、特点、用途点击；先指物再说，随后揭示支架；可重新观察。", "teacherDemo": "按“名字—特点—用途”逐次点开问题。孩子先指认再说，老师一次只追问一个细节；无法验证的功能说“我们还要核实”。"}, {"id": 11, "chapter": "观察与理由", "title": "把“因为”后面写完整", "kind": "reason", "minutes": 3, "lead": "我想选……，因为……", "items": ["选一件普通物品", "联系一个自己的需要", "说出打算怎样使用"], "ask": "你可以口头说，也可以把一句理由记在这里。", "guide": "老师或孩子录入一句练习表达；工具只给追问，不作AI评分。低龄先指物、说名，再由老师问“你想怎样用它”。", "feedback": "没有自动对错分；教师根据现场回答选择一个追问。", "nextline": "给同伴听，再说第二次。", "displayNumber": 9, "operation": "输入或口头说理由；点时间、动作、需要提示；最后用自己的细节再说一次。", "teacherDemo": "老师或孩子录入一句练习表达；工具只给追问，不作AI评分。低龄先指物、说名，再由老师问“你想怎样用它”。"}, {"id": 12, "chapter": "观察与理由", "title": "两个人，都有麦克风时间", "kind": "pair", "minutes": 3, "lead": "一人说，一人听，然后交换。", "items": ["第一轮：我想选……因为……", "听的人：我听见你的理由是……", "第二轮：交换，说得更具体一点"], "ask": "30秒说理由，30秒复述，再交换。", "guide": "按座位两人配对。计时只提醒不判输赢，不自动换页；必要时暂停。老师先照顾安静孩子，给句首，不代答。", "feedback": "每人至少一次表达和一次倾听；只记录观察到的表现。", "nextline": "小潘听过大家的理由，想法变了。", "seconds": 60, "displayNumber": 10, "operation": "A说30秒，B复述30秒；计时可暂停；手动交换角色，再做一轮。", "teacherDemo": "按座位两人配对。计时只提醒不判输赢，不自动换页；必要时暂停。老师先照顾安静孩子，给句首，不代答。"}, {"id": 13, "chapter": "预算与判断", "title": "改变主意，也可以有理由", "kind": "story", "minutes": 1, "lead": "小潘发现，自己家里已经有两盒彩铅。", "items": ["原来：朋友喜欢，我也想选", "现在：我更想把故事记录下来", "改变：有了新的信息，再作决定"], "ask": "你认为小潘改变了什么？什么没有变？", "guide": "这段故事延续同一人物和物件。不评价“买本子就比买彩铅好”，引导孩子说信息如何影响决定。", "feedback": "选择变了，仍需说清自己的理由。保持原决定也可以。", "nextline": "把自己的计划先记下来。", "art": "writing", "displayNumber": 11, "operation": "先说原来为什么选；点开现在的新信息；解释改变或维持的理由。", "teacherDemo": "这段故事延续同一人物和物件。不评价“买本子就比买彩铅好”，引导孩子说信息如何影响决定。"}, {"id": 14, "chapter": "预算与判断", "title": "预算，是提醒自己的计划", "kind": "budget", "minutes": 2, "lead": "能用多少，与愿意用多少，不是一回事。", "items": ["我有100积分币", "这件最多愿付30", "超过我的计划，我可以停"], "ask": "如果还有余额，你就必须继续吗？", "guide": "屏幕100为练习算例，并非每人统一获得。实际积分=9月出勤次数×10+9月全勤奖励10（符合才加）+10月出勤次数×10+10月全勤奖励10（符合才加），10月30日前完成统计。剩分保留；150只是配券备量，不是个人积分。个人愿付上限仍可低于规则上限。", "feedback": "足够支付并不代表必须购买，个人计划可以不同。", "nextline": "正式成交后，要马上支付自己的积分币。", "reveal": ["我有多少：余额", "我愿意付多少：个人上限", "我最多能报多少：还要看本场规则"], "displayNumber": 12, "operation": "拖动个人上限；先预计35报价是否超过计划，再点核对；重置可回30。", "teacherDemo": "屏幕100为练习算例，并非每人统一获得。实际积分=9月出勤次数×10+9月全勤奖励10（符合才加）+10月出勤次数×10+10月全勤奖励10（符合才加），10月30日前完成统计。剩分保留；150只是配券备量，不是个人积分。个人愿付上限仍可低于规则上限。"}, {"id": 15, "chapter": "预算与判断", "title": "成交后，马上支付积分币", "kind": "payment", "minutes": 2, "lead": "拿到自己的积分币，成交后当场支付。", "items": ["领取时：数清自己的积分币", "成交后：按成交价马上付款", "付完后：一起点清剩余币"], "ask": "请用练习币走一遍：点清 → 付款 → 核对。", "guide": "100−35=65仅是付款练习，不能替代实际积分。准备每人10分券10张、5分券8张、1分券10张，合计150分28张是备量，按实得积分组合发放，剩分保留。成交后本人当场付款，双方点清、核对后登记领取；试拍不扣正式积分。", "feedback": "核对的是实付数量、成交价和剩余币是否一致。发现不一致先暂停、当面复点；不让孩子承担登记错误。", "nextline": "下一题，手里的积分币不够怎么办？", "start": 100, "cost": 35, "answer": 65, "reveal": ["成交35积分，就当场交付35积分。", "老师和孩子共同点清：还剩65积分。", "核对、登记完成，再领取拍品。"], "displayNumber": 13, "operation": "从100积分的练习币里选出35再确认；少付或多付保留选择并给差额；准确付款后核对剩65；可重试。", "teacherDemo": "100−35=65仅是付款练习，不能替代实际积分。准备每人10分券10张、5分券8张、1分券10张，合计150分28张是备量，按实得积分组合发放，剩分保留。成交后本人当场付款，双方点清、核对后登记领取；试拍不扣正式积分。"}, {"id": 16, "chapter": "预算与判断", "title": "20，能报25吗？", "kind": "decision", "minutes": 2, "lead": "计算练习：我只有20，下一次报价是25。", "items": ["继续报25", "停止这一轮", "先请老师核对余额"], "ask": "选择一个动作，再说明原因。", "guide": "这题有数值限制。点“继续”需解释差额5并提供重试；停止和核对都可成立。不同于个人偏好题。", "feedback": "先查清20与25；不能借别人的币，也不能让家长补钱。", "nextline": "如果余额够，还能停吗？", "balance": 20, "price": 25, "answers": ["25比20多5，余额不足。先核对或停止，再回到题目重新选。", "可以。试着说“我决定停下，因为这次超过了我的余额”。", "可以。核对后如果仍是20，就不能报25。确认信息后再决定。"], "displayNumber": 14, "operation": "对照20余额与25报价；选一项，再看差额5和追问；重试允许修正。", "teacherDemo": "这题有数值限制。点“继续”需解释差额5并提供重试；停止和核对都可成立。不同于个人偏好题。"}, {"id": 17, "chapter": "预算与判断", "title": "够支付，也能说“停”", "kind": "decision", "minutes": 2, "lead": "我有40，下一次报价30；原计划最多25。", "items": ["继续，但先重新说明计划", "停止，保留自己的选择", "再问清一个用途"], "ask": "这里没有唯一的个人选择。关键是理由。", "guide": "先给5秒静想，点选只展示追问，不出现勾叉排名。若改变预算，必须仍在余额和本场上限内。", "feedback": "继续要有新考虑；停止同样成立；问清信息也是一步。", "nextline": "写下你的个人计划。", "balance": 40, "price": 30, "answers": ["你能支付。是什么新信息让你改变了原来25的计划？请说明，不只因为别人加价。", "尊重自己的计划是一种选择。把“因为……”说完整。", "你还想知道什么？问清后，回到自己的计划再决定。"], "displayNumber": 15, "operation": "同时看40余额、30报价、25原计划；停或继续都需自己的理由。", "teacherDemo": "先给5秒静想，点选只展示追问，不出现勾叉排名。若改变预算，必须仍在余额和本场上限内。"}, {"id": 18, "chapter": "预算与判断", "title": "我的选择卡", "kind": "plan", "minutes": 3, "lead": "先独立决定，不急着看别人。", "items": ["我最想选：______", "我的理由：______", "我的愿付上限：______"], "ask": "先填卡，再跟同伴解释一次。", "guide": "个人愿付上限可填0至100，仍不得超过所拍档位封顶和本人实际余额。可低于任何上限；先表达需要，家长不代选。", "feedback": "上限低于或等于本场上限及余额；选择可以后来改变，但要说明原因。", "nextline": "把个人计划放进统一规则里。", "displayNumber": 16, "operation": "填写选择、理由、上限；点核对；输入仅保留本机，不录真实积分。", "teacherDemo": "个人愿付上限可填0至100，仍不得超过所拍档位封顶和本人实际余额。可低于任何上限；先表达需要，家长不代选。"}, {"id": 19, "chapter": "举牌与试拍", "title": "先把规则说清楚", "kind": "rules", "minutes": 2, "lead": "按本人实得积分参与 · 剩余积分保留", "items": ["1/5/10：低中高起拍", "+2：最后可+1到封顶", "50/80/100：低中高封顶"], "ask": "请用自己的话，说出一条规则。", "guide": "低/中/高档1/5/10起拍，+2，50/80/100封顶；低中最后+1到封顶。每人跨档最多2份。封顶先喊出者得；听不清先停，不自动抽签。流拍二轮统一5起拍，再流拍收回。100只作练习，150只作券料，实际按9/10月出勤及月全勤奖励统计，剩分保留。", "feedback": "不以关注转发、续费金额或家长代答增加竞拍优势。", "nextline": "把举牌的话说完整。", "displayNumber": 17, "operation": "依次点击起拍、加价、封顶三组；读出本档封顶，再让孩子复述最多2份、剩分保留。", "teacherDemo": "低/中/高档1/5/10起拍，+2，50/80/100封顶；低中最后+1到封顶。每人跨档最多2份。封顶先喊出者得；听不清先停，不自动抽签。流拍二轮统一5起拍，再流拍收回。100只作练习，150只作券料，实际按9/10月出勤及月全勤奖励统计，剩分保留。"}, {"id": 20, "chapter": "举牌与试拍", "title": "替主持人修一句话", "kind": "repair", "minutes": 2, "lead": "“我要！我要！我要！”", "items": ["还缺我的号码", "还缺清楚的报价", "还缺等主持人点到我"], "ask": "每找到一个缺项，就点开一张提示。", "guide": "老师先故意说一次模糊报价，孩子指出缺项再点。不要一次把答案全显示。理由放在表达时段，不要求每次加价都讲长稿。", "feedback": "可修成“我是03号，我出30积分”。此处30按高档报价练习。", "nextline": "你来报一次，主持人复述一次。", "reveal": ["我是03号。", "我出30积分。", "等点名，再清楚说。"], "displayNumber": 18, "operation": "先听抢喊原句；逐次补号码、报价、等待确认；重置后让孩子自己说。", "teacherDemo": "老师先故意说一次模糊报价，孩子指出缺项再点。不要一次把答案全显示。理由放在表达时段，不要求每次加价都讲长稿。"}, {"id": 21, "chapter": "举牌与试拍", "title": "牌号＋报价，让别人听清", "kind": "quote", "minutes": 2, "lead": "我是……号，我出……积分币。", "items": ["举牌：看得见，不挡同伴", "等点名：再开口", "报价：说完整，不抢喊"], "ask": "练习号牌和金额，再请同伴复述确认。", "guide": "练习先选低中高档，再报编号和金额；按本班1至N校验号码，按该档起拍、+2及末口到封顶校验。先报号码再由主持人复述确认。这里不记正式成交。", "feedback": "清晰比喊得大声更重要；听不清可以重报。", "nextline": "把一轮竞拍排成正确顺序。", "displayNumber": 19, "operation": "选择档位，修改练习编号和报价；非法范围可修正重试。", "teacherDemo": "练习先选低中高档，再报编号和金额；按本班1至N校验号码，按该档起拍、+2及末口到封顶校验。先报号码再由主持人复述确认。这里不记正式成交。"}, {"id": 22, "chapter": "举牌与试拍", "title": "先做哪一步？", "kind": "sequence", "minutes": 2, "lead": "点四张步骤条，把顺序排出来。", "items": ["落槌后付款、登记、领取", "看与听介绍", "举牌、点名、报价", "核对余额与资格"], "ask": "排完点“核对”；错了可以重排。", "guide": "核对余额与资格必须发生在落槌前；落槌后本人立即支付，登记老师点收、确认剩余币，完成登记再领取。四步中的末步包含付款与登记，不等到最后统一收费。", "feedback": "介绍 → 报价 → 核对 → 落槌、付款、登记领取。", "nextline": "试拍时，也可能有人停下来。", "order": [1, 2, 3, 0], "displayNumber": 20, "operation": "点步骤排到四格跑道；核对后用动作走一遍；清空可重排。", "teacherDemo": "核对余额与资格必须发生在落槌前；落槌后本人立即支付，登记老师点收、确认剩余币，完成登记再领取。四步中的末步包含付款与登记，不等到最后统一收费。"}, {"id": 23, "chapter": "举牌与试拍", "title": "“我不拍了”，怎样接？", "kind": "choice", "minutes": 1, "lead": "听见别人的决定，先留出空间。", "items": ["怎么这么胆小，继续呀", "可以，你愿意说一个原因吗？", "没拍到就没表现好"], "ask": "你想怎样回应同伴？", "guide": "先问孩子为什么这样选再点反馈。对不愿公开解释的孩子接受停止，课后单独支持，不逼问家庭经济或私事。", "feedback": "不把继续加价当勇敢，不把停下当失败。", "nextline": "遇到同价，也要按规则处理。", "answers": ["这句话会把决定变成压力。可以改成“你愿意说说自己的考虑吗？”", "先尊重，再邀请解释。对方暂时不想说，也允许停下。", "是否竞得不是表达表现的标准。可以关注他有没有说清理由或认真倾听。"], "displayNumber": 21, "operation": "先读同伴原话；讨论怎样回应；点反馈后可返回改说法。", "teacherDemo": "先问孩子为什么这样选再点反馈。对不愿公开解释的孩子接受停止，课后单独支持，不逼问家庭经济或私事。"}, {"id": 24, "chapter": "举牌与试拍", "title": "同价时，不比谁嗓门大", "kind": "fair", "minutes": 1, "lead": "先暂停，按事先公布的办法。", "items": ["先核对是哪位先清楚喊出封顶价，且余额、资格有效", "封顶同价：先喊出封顶价者得，不抽签", "只扣最终竞得者的积分；未竞得者保留积分"], "ask": "同价时，主持人要先确认什么？", "guide": "封顶同价以最先喊出封顶价且资格有效者得，不以音量或表达评分决定。主持人听不清时先暂停核实，不由网页自动判断时间，不临时改为抽签。每人最多2份，未竞得不扣分。", "feedback": "未竞得者保留币，可继续后续类别；已竞得者改做介绍或提问。", "nextline": "先演练一轮，不扣真实积分。", "displayNumber": 22, "operation": "点击先核对、按办法、再登记；明确先喊出封顶价者得。", "teacherDemo": "封顶同价以最先喊出封顶价且资格有效者得，不以音量或表达评分决定。主持人听不清时先暂停核实，不由网页自动判断时间，不临时改为抽签。每人最多2份，未竞得不扣分。"}, {"id": 25, "chapter": "举牌与试拍", "title": "试拍一次，练会再开始", "kind": "auction", "minutes": 3, "lead": "课堂模拟 · 不扣真实积分", "items": ["练习拍品：故事本", "低档1起拍、+2、50封顶；最后可+1", "试拍100分与正式积分分离"], "ask": "主持人，请复述报价，再核对。", "guide": "本页用100练习分走一轮低档报价。范围按本班人数，+2，49可+1到50，每人练习最多2份。主持口令三句后核对，再模拟付款。试拍不扣正式积分，试拍库存/余额/账本与正式完全隔离。", "feedback": "有错误先停下、说明、再试一次，不扣惩罚币。", "nextline": "现在喝口水，再把表达带入竞拍。", "lot": "practice", "displayNumber": 23, "operation": "先选择班场；报编号与金额，主持三句，再核对并模拟记录。支持撤销试拍上一笔。", "teacherDemo": "本页用100练习分走一轮低档报价。范围按本班人数，+2，49可+1到50，每人练习最多2份。主持口令三句后核对，再模拟付款。试拍不扣正式积分，试拍库存/余额/账本与正式完全隔离。"}, {"id": 26, "chapter": "竞拍与核对", "title": "喝口水，看看自己的计划", "kind": "break", "minutes": 3, "lead": "中场暂停 · 音乐不自动播放", "items": ["核对选择卡", "看看剩余币记录", "需要帮助，找协助老师"], "ask": "休息结束，再决定下一步。", "guide": "四分钟含饮水、回座与核对。计时器只提示不自动跳页或落槌，孩子需要时暂停。教师检查台账，不趁休息加讲新概念。", "feedback": "安静或情绪紧张的孩子可以稍作调节，不用新奖品诱导继续。", "nextline": "第一类拍品，先听介绍。", "seconds": 180, "displayNumber": 24, "operation": "启动休息计时；看看自己的选择卡；需要帮助时先暂停，不自动翻页。", "teacherDemo": "四分钟含饮水、回座与核对。计时器只提示不自动跳页或落槌，孩子需要时暂停。教师检查台账，不趁休息加讲新概念。"}, {"id": 27, "chapter": "竞拍与核对", "title": "正式拍卖｜把理由讲清楚", "kind": "auction", "minutes": 25, "lead": "按本班正式拍品逐件进行；备用明确启用后才可拍", "items": ["先介绍准确品名与用途，再举牌", "按本档起拍、加价和封顶执行", "当场点收付款后记录，核对后领取"], "ask": "介绍员先说用途，其他人听完再举牌。", "guide": "正式25分钟：20件班约每件1分钟，另留5分钟核对；14件班可增加表达时间。提前摆好正式品，备用牙线/垃圾袋各1单放。3班美甲贴改1，5班14正式+2备用。8班9人最多成交18份，5班6人最多12份，未售不强迫成交，不突破每人2份。低/中/高档1/5/10起拍，+2，50/80/100封顶；低中最后+1到封顶。每人跨档最多2份。封顶先喊出者得；听不清先停，不自动抽签。流拍二轮统一5起拍，再流拍收回。100只作练习，150只作券料，实际按9/10月出勤及月全勤奖励统计，剩分保留。 每位初始积分须在设置录入真实核定值，空白不等于100或150。逐件选品，先介绍用途/权益具体内容，完整走主持口令，封顶手动核实先喊者，实体券当面点收后再记录。首轮流拍进入二轮5分，再流拍收回。库存、积分、限得按班分开；撤销恢复对应余额与该件状态。网页不自动收付，也不承诺权益使用期限。", "feedback": "避免所有时间只听活跃孩子；未竞价者可做提问者。", "nextline": "每笔当场付款，再共同核对记录。", "lot": "lot1", "displayNumber": 25, "operation": "选择本班具体单件→介绍/提问→编号和报价→三句主持口令→若封顶核实先喊者→本人确认→点收实体券→记录；流拍按两轮处理，可撤销本班上一笔。", "teacherDemo": "正式25分钟：20件班约每件1分钟，另留5分钟核对；14件班可增加表达时间。提前摆好正式品，备用牙线/垃圾袋各1单放。3班美甲贴改1，5班14正式+2备用。8班9人最多成交18份，5班6人最多12份，未售不强迫成交，不突破每人2份。低/中/高档1/5/10起拍，+2，50/80/100封顶；低中最后+1到封顶。每人跨档最多2份。封顶先喊出者得；听不清先停，不自动抽签。流拍二轮统一5起拍，再流拍收回。100只作练习，150只作券料，实际按9/10月出勤及月全勤奖励统计，剩分保留。 每位初始积分须在设置录入真实核定值，空白不等于100或150。逐件选品，先介绍用途/权益具体内容，完整走主持口令，封顶手动核实先喊者，实体券当面点收后再记录。首轮流拍进入二轮5分，再流拍收回。库存、积分、限得按班分开；撤销恢复对应余额与该件状态。网页不自动收付，也不承诺权益使用期限。"}, {"id": 31, "chapter": "竞拍与核对", "title": "付完积分币，再核对记录", "kind": "receipt", "minutes": 2, "lead": "号码、成交价、实付币、剩余币，当面核对。", "items": ["这是谁的号码？", "成交价与实付积分币一致吗？", "剩余币与登记一致吗？"], "ask": "每笔成交当场支付；有出入，先暂停领取、一起复点。", "guide": "只显示本班正式登记，试拍不混入。按编号、拍品、成交实付、当前余额和累计竞得数核对。每笔须先点收实体券再记录，不能到本页才付款。可在设置下载本班备份；清理浏览器或换设备不会自动同步。剩余积分保留。", "feedback": "个人初始积分为实际核定值；100−35=65只作练习，不当作本班记录。", "nextline": "东西可以不同，理由都值得听。", "displayNumber": 26, "operation": "核对最近6笔本班记录，查看剩分和累计份数；设置可查看全部并下载本班备份。", "teacherDemo": "只显示本班正式登记，试拍不混入。按编号、拍品、成交实付、当前余额和累计竞得数核对。每笔须先点收实体券再记录，不能到本页才付款。可在设置下载本班备份；清理浏览器或换设备不会自动同步。剩余积分保留。"}, {"id": 32, "chapter": "倾听与回应", "title": "先复述，再提问", "kind": "listen", "minutes": 2, "lead": "听见，不只是安静坐着。", "items": ["我听见你想选……", "因为你准备……", "我想知道……"], "ask": "先等同伴确认，再问你的问题。", "guide": "同伴先说20—30秒，倾听者复述一个意思。说话者可纠正，确认后再点开提问示例。不要把教师复述替代孩子倾听。", "feedback": "提问跟对方理由有关，不考倒对方。", "nextline": "哪一个问题，能帮助你听明白？", "reveal": ["你准备在什么时候用它？", "如果没有竞得，你还有什么办法？"], "displayNumber": 27, "operation": "先听原话，点开始复述；手动等对方回应，再进入说者确认、相关追问；可收起重来。", "teacherDemo": "同伴先说20—30秒，倾听者复述一个意思。说话者可纠正，确认后再点开提问示例。不要把教师复述替代孩子倾听。"}, {"id": 33, "chapter": "倾听与回应", "title": "好问题，接着对方的话", "kind": "choice", "minutes": 2, "lead": "同伴说：“我想用本子记录自己编的故事。”", "items": ["你为什么不选贵一点的？", "你最想先记录哪个人物？", "你是不是一定要赢？"], "ask": "选一个问题，再试着问出来。", "guide": "先让同伴讨论，老师点击反馈。围绕用途与个人计划继续，而不是把“贵”或“赢”设成唯一价值。", "feedback": "问题是否相关可讨论，不给孩子贴会/不会听的标签。", "nextline": "把“说—听—问—答”走完整。", "answers": ["可以进一步改成与用途有关的问题：你准备记录什么？不默认越贵越值得。", "这个问题接住了“编故事”。请对方回答后，再复述一个新信息。", "它把重点放在输赢。可以问“这件东西为什么适合你的计划？”"], "displayNumber": 28, "operation": "读同伴原话再选追问；先口头讨论再揭示反馈；返回重试。", "teacherDemo": "先让同伴讨论，老师点击反馈。围绕用途与个人计划继续，而不是把“贵”或“赢”设成唯一价值。"}, {"id": 34, "chapter": "倾听与回应", "title": "交换一次，听见两个人", "kind": "pair", "minutes": 3, "lead": "两个人，四个动作。", "items": ["A说理由，B复述", "A确认或补充，B提一个问题", "A回答，然后交换角色"], "ask": "每人都完成一次说、听、问、答。", "guide": "给每组完整轮换，不只请代表上台。教师巡视记一句真实原话，基础弱孩子可先用一个词或指物，不连续追问三四次。", "feedback": "老师一次给一个建议，例如“先复述用途，再问什么时候使用”。", "nextline": "回头看看，最初的计划还一样吗？", "seconds": 90, "displayNumber": 29, "operation": "A说、B复述、A确认、B问、A答；90秒提醒；手动交换角色再完成一轮。", "teacherDemo": "给每组完整轮换，不只请代表上台。教师巡视记一句真实原话，基础弱孩子可先用一个词或指物，不连续追问三四次。"}, {"id": 35, "chapter": "回顾与延伸", "title": "我的选择，前后有什么不同？", "kind": "reflect", "minutes": 3, "lead": "原来我想……现在我决定……因为……", "items": ["可以维持原计划", "可以有新理由而改变", "可以停止，也可以继续观察"], "ask": "对家长或同伴，解释一个真实决定。", "guide": "拿出课前选择卡，与现在对照。没有拍中也能讲停止或观察的理由；不把所有变化都写成进步。家长先听再复述。", "feedback": "只记事实：孩子补了什么信息、怎样解释、怎样回应。", "nextline": "把一个具体进步说给孩子听。", "displayNumber": 30, "operation": "对照先前选择和现在决定；写一个真实理由；维持原计划也成立。", "teacherDemo": "拿出课前选择卡，与现在对照。没有拍中也能讲停止或观察的理由；不把所有变化都写成进步。家长先听再复述。"}, {"id": 36, "chapter": "回顾与延伸", "title": "今天，我听见了什么？", "kind": "feedback", "minutes": 2, "lead": "一句事实＋一个下一步。", "items": ["我听见你说……", "你把……说明白了", "下次试着……"], "ask": "请选择一个你确实观察到的表现。", "guide": "教师按钮展示的是反馈句框，不是自动判定。没有观察证据就不套用；公开只选少量例子，其他孩子用反馈卡补齐。", "feedback": "反馈落到用途、理由、复述或决定，不统一写“都很棒”。", "nextline": "把这个动作带回家。", "reveal": ["你补充了“什么时候用”，理由更具体。", "你先复述同伴，再问了一个有关的问题。", "你说清了停下的原因，下次试着补一个替代办法。"], "displayNumber": 31, "operation": "先说观察到的原话；逐步展开具体表现与一个下一步建议；不评价输赢。", "teacherDemo": "教师按钮展示的是反馈句框，不是自动判定。没有观察证据就不套用；公开只选少量例子，其他孩子用反馈卡补齐。"}, {"id": 37, "chapter": "回顾与延伸", "title": "回家，再做一次自己的选择", "kind": "homework", "minutes": 2, "lead": "选一档练习，不照背示范。", "items": ["入门：一件物品＋一个自己的理由", "基础：用途＋理由＋回答一个问题", "进阶：比较两件＋决定＋回应追问"], "ask": "家长只问一个问题，把回答留给孩子。", "guide": "三档按实际表达能力选，不按红蓝风格分层。提交方式/截止/反馈时间由当班老师填写；不要求公开发布视频。示例台词可看，但不能逐字照背。", "feedback": "允许停顿与口头补交，是否可补交按本班实际安排。", "nextline": "最后，把选择与声音带走。", "displayNumber": 32, "operation": "切换三档任务；按能力选一档；录制前先说一遍，不照背方法示例。", "teacherDemo": "三档按实际表达能力选，不按红蓝风格分层。提交方式/截止/反馈时间由当班老师填写；不要求公开发布视频。示例台词可看，但不能逐字照背。"}, {"id": 38, "chapter": "回顾与延伸", "title": "有声，\n有主见", "kind": "closing", "minutes": 2, "lead": "彼得潘 · 表达与选择", "items": ["让坚持，成为底气", "每一次认真与坚持，", "都值得被看见。"], "ask": "把一句自己的理由，留在今天。", "guide": "收回工具，确认领取与离场安排。合影自愿且按既有影像权限，不只展示竞得者；安排下一步家长反馈，不现场承诺长期能力变化。", "feedback": "尊重每个孩子不同的决定。", "nextline": "课程结束，保留观察，继续练习。", "displayNumber": 33, "operation": "请孩子补一句今天自己的决定；回应具体理由；不按竞得数量评表现。", "teacherDemo": "收回工具，确认领取与离场安排。合影自愿且按既有影像权限，不只展示竞得者；安排下一步家长反馈，不现场承诺长期能力变化。"}], "rules": {"initial": 100, "opening": 1, "step": 2, "cap": 100, "children": 13, "maxWins": 2, "initialIsSample": true}, "lots": {"practice": {"name": "故事本（试拍）", "units": 4}, "lot1": {"name": "按本班实际正式拍品逐件选择", "units": null}}, "versionId": "20261022-teacher-r5", "hostNotes": "低/中/高档1/5/10起拍，+2，50/80/100封顶；低中最后+1到封顶。每人跨档最多2份。封顶先喊出者得；听不清先停，不自动抽签。流拍二轮统一5起拍，再流拍收回。100只作练习，150只作券料，实际按9/10月出勤及月全勤奖励统计，剩分保留。"};</script><script>(()=>{'use strict';
const C=window.COURSE,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const detail=(p,s)=>(s.details[p.displayNumber]??={step:0});
const button=(text,action,attr='',cls='action')=>`<button class="${cls}" data-action="${action}" ${attr}>${text}</button>`;
const tabs=(labels,d,act='f-step')=>`<div class="tabs">${labels.map((x,i)=>button(esc(x),act,`data-index="${i}" aria-pressed="${(d.step||0)===i}"`,(d.step||0)===i?'active':'')).join('')}</div>`;
const title=(a,b='',small='')=>`<div class="display-head">${small?`<small>${small}</small>`:''}<h1>${a}${b?`<span>${b}</span>`:''}</h1></div>`;
const photo=(file,alt,cls='')=>`<img class="subject ${cls}" src="assets/${file}" alt="${alt}">`;
const feedback=d=>`<p class="feedback" role="status">${esc(d.note||'')}</p>`;
const subjects=[['props-cutout.webp','故事本'],['pencils.webp','彩铅'],['item-2.webp','拼图']];
function choose(p,s){const a=s.answers[p.displayNumber];return a===undefined?`<div class="choice-list">${p.items.map((x,i)=>button(`<b>${String.fromCharCode(65+i)}</b><span>${esc(x)}</span><i>说理由，再点 ↗</i>`,'f-choose',`data-index="${i}"`,'choice-line')).join('')}</div>`:`<div class="choice-response"><small>你的考虑 · ${String.fromCharCode(65+a)}</small><h2>${esc(p.items[a])}</h2><p>${esc(p.answers[a])}</p>${button('返回，换一种考虑 ↻','f-retry')}</div>`;}
let clock=null;const stopTimer=()=>{if(clock){clearInterval(clock);clock=null;}};
const clockText=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
const timer=(p,d)=>`<div class="timer-face"><small>时间留给两个人</small><strong id="clock">${clockText(d.remaining??p.seconds??3)}</strong><div>${button('开始 / 暂停','f-timer')}${button('重新计时','f-timer-reset','','quiet')}</div><span>只提醒 · 不自动翻页</span></div>`;
function core(p,s){const n=p.displayNumber,d=detail(p,s),k=d.step||0;
switch(n){
case 2:return `${title('今天，','你来决定。','不是比谁拍得多')}<div class="mission-type">${['说','听','选'].map((t,i)=>button(t,'f-step',`data-index="${i}"`,i===k?'selected':'')).join('')}</div><div class="mission-copy"><small>0${k+1} / 今天的本领</small><h2>${['说具体','听明白','有主见'][k]}</h2><p>${esc(p.items[k].split('：').slice(1).join('：'))}</p><span>跟同伴说：今天我想练习……</span></div>`;
case 3:return `${title('爸妈，','先听我说。')}<div class="parent-photo">${photo('writing.webp','桌上留给孩子的记录空间')}</div><div class="parent-task"><small>家长的观察任务</small><h2>${['先等三秒','记一句原话','只问一个问题'][k]}</h2><p>${['把回答留给孩子。','记下他实际说过的话。','说完，再问一个具体细节。'][k]}</p>${tabs(['等一等','记原话','问一个'],d)}${k===0?`<div class="three-second"><b id="clock">${d.remaining??3}</b>${button('一起等三秒','f-timer')}</div>`:''}</div>`;
case 5:return `${title('先问？','先看？','替小潘作第一次选择')}<div class="fork-symbol">↗</div>${choose(p,s)}`;
case 6:return `<div class="paddle-prop"><b>03</b><span>我的号码</span></div>${title('号码，','不是金额。')}<div class="number-price"><small>这一轮报价</small><b>30<span>积分</span></b><div>${button('03是编号','f-number','data-index="0"')}${button('03是要付的币','f-number','data-index="1"','quiet')}</div>${feedback(d)}</div>`;
case 7:{const i=d.object;if(i===undefined)return `${title('三件物品，','怎么用？')}<div class="object-gallery">${subjects.map(([im,name],j)=>button(`${photo(im,name,j<2?'cutout':'')}<b>${name}</b><span>点开用途 ↗</span>`,'f-gallery',`data-index="${j}"`,'gallery-piece')).join('')}</div><p class="small-caption">练习类别示意 · 不是正式采购清单</p>`;return `${title(subjects[i][1],'你会怎么用？')}<div class="gallery-focus">${photo(subjects[i][0],subjects[i][1],i<2?'cutout':'')}</div><div class="gallery-use"><small>一种可能的用途</small><h2>${esc(p.items[i].split('：')[1])}</h2><p>你准备在什么时候用它？</p>${button('返回，看另外两件 ↻','f-gallery-back')}</div>`;}
case 8:return `${title('先看见，','再下结论。')}<div class="inspect-photo">${photo('props-cutout.webp','本子、笔袋与铅笔的可见细节','cutout')}</div><div class="inspect-prompt">${tabs(['名字','特点','用途'],d)}<h2>${esc(p.items[k])}</h2><p>${d.open?esc(p.answers[k]):'先指给同伴看，再说你的发现。'}</p>${button(d.open?'收起提示':'看看表达提示 ↗','f-open')}</div>`;

</script><script>window.OFFLINE_GUIDE="<!doctype html><meta charset=\"utf-8\"><style>body{background:#f6eddd;color:#24483c;font:17px/1.9 system-ui;margin:35px auto;max-width:1000px;padding:0 30px}article{border-top:1px solid #b6b19a;padding:20px 0}a{color:#1a547c}h3{font-size:18px;color:#bd513e}</style><main><a href=\"#\" data-offline-close=\"1\">← 返回课件</a><h1>人生拍卖会 R5｜逐页授课流程</h1><p>33页／90分钟。2026-10-22教师参数；红蓝内容一致。课前先从底部“老师先看这里”选择班场和录入核定积分。数据只在本机，不自动发送。</p><p>低/中/高档1/5/10起拍，+2，50/80/100封顶；低中最后+1到封顶。每人跨档最多2份。封顶先喊出者得；听不清先停，不自动抽签。流拍二轮统一5起拍，再流拍收回。100只作练习，150只作券料，实际按9/10月出勤及月全勤奖励统计，剩分保留。</p><article id=\"p1\"><h2>第1页 · 让坚持，\n成为底气</h2><p><a href=\"#p1\" data-offline-theme=\"red\" data-offline-page=\"1\">红版</a> / <a href=\"#p1\" data-offline-theme=\"blue\" data-offline-page=\"1\">蓝版</a> · 0—2分钟</p><h3>学生动作</h3><p>找到你的号码牌。先看，不急着举。</p><h3>点击顺序</h3><p>观察舞台道具；找到号码牌；说出一个看到的物品。</p><h3>教师组织</h3><p>签到号码按本班人数1至N发放。在“老师先看这里”选择正确班场，录入每个号码经核定的实得积分，再按实发放实体券。100仅是练习值；150仅为配券备料。</p><h3>回应纠错</h3><p>孩子能找到号码、说出一个看到的物件即可。</p><h3>下一句</h3><p>今天，要把决定交给你。</p></article><article id=\"p2\"><h2>第2页 · 今天，你来做决定</h2><p><a href=\"#p2\" data-offline-theme=\"red\" data-offline-page=\"2\">红版</a> / <a href=\"#p2\" data-offline-theme=\"blue\" data-offline-page=\"2\">蓝版</a> · 2—4分钟</p><h3>学生动作</h3><p>跟同伴说：今天我想练习……</p><h3>点击顺序</h3><p>依次点开说、听、决定；每一步请一位孩子用动作演示。</p><h3>教师组织</h3><p>先给15秒思考，再两人各说20秒。接受一个词，邀请补成一句。请两名孩子回应即可，避免本班学生轮流上台占满时间。</p><h3>回应纠错</h3><p>不以声音大、出价高作为本领强的证据。</p><h3>下一句</h3><p>先给家长一个小任务。</p></article><article id=\"p3\"><h2>第3页 · 爸妈，先听我说</h2><p><a href=\"#p3\" data-offline-theme=\"red\" data-offline-page=\"3\">红版</a> / <a href=\"#p3\" data-offline-theme=\"blue\" data-offline-page=\"3\">蓝版</a> · 4—5分钟</p><h3>学生动作</h3><p>孩子说完后，再问：你为什么这样想？</p><h3>点击顺序</h3><p>依次点先等待、记原话、问一个；家长先试着安静等三秒。</p><h3>教师组织</h3><p>请家长用观察卡记原话。无人陪同的孩子由协助老师记录。家长代答时说“我们先听孩子说完，稍后请您问一个问题”。</p><h3>回应纠错</h3><p>记录真实表达，不写统一的“表现特别棒”。</p><h3>下一句</h3><p>如果三个东西都喜欢，怎样选？</p></article><article id=\"p4\"><h2>第4页 · 都喜欢，就都要吗？</h2><p><a href=\"#p4\" data-offline-theme=\"red\" data-offline-page=\"4\">红版</a> / <a href=\"#p4\" data-offline-theme=\"blue\" data-offline-page=\"4\">蓝版</a> · 5—6分钟</p><h3>学生动作</h3><p>先别替小潘选。你还想知道什么？</p><h3>点击顺序</h3><p>切换物品，先猜再点“看看小潘怎么想”；每次切换重新隐藏想法。</p><h3>教师组织</h3><p>这是虚构练习情境，物品不是正式拍品。由老师分别读出三句想法，只让孩子补“还想知道什么”，不先讲大道理。</p><h3>回应纠错</h3><p>孩子可以问玩法、用途、自己已有物品；没有唯一答案。</p><h3>下一句</h3><p>替小潘作第一次选择。</p></article><article id=\"p5\"><h2>第5页 · 先选哪一步？</h2><p><a href=\"#p5\" data-offline-theme=\"red\" data-offline-page=\"5\">红版</a> / <a href=\"#p5\" data-offline-theme=\"blue\" data-offline-page=\"5\">蓝版</a> · 6—8分钟</p><h3>学生动作</h3><p>点一个考虑，再说出你的理由。</p><h3>点击顺序</h3><p>学生先选并说明；老师再点反馈；返回后换一种考虑。</p><h3>教师组织</h3><p>允许学生举手表达，由老师点按钮。先听原因再打开反馈；选“马上举”也不嘲笑，追问是否了解物品。</p><h3>回应纠错</h3><p>判断的是考虑有没有说清楚，不把个人偏好打成对错。</p><h3>下一句</h3><p>认识让选择顺利进行的工具。</p></article><article id=\"p6\"><h2>第6页 · 号码不是金额</h2><p><a href=\"#p6\" data-offline-theme=\"red\" data-offline-page=\"6\">红版</a> / <a href=\"#p6\" data-offline-theme=\"blue\" data-offline-page=\"6\">蓝版</a> · 8—9分钟</p><h3>学生动作</h3><p>请说：我是03号，我准备出……积分币。</p><h3>点击顺序</h3><p>看03号码牌和30报价；点选谁是编号，再说一次完整报价。</p><h3>教师组织</h3><p>把实物号码牌举到主持人看得见的位置，不挡同伴。让两名孩子示范“号码”和“金额”，不要求每次报价都长篇说理由。</p><h3>回应纠错</h3><p>03是编号；30才是这次报价。号码示例适用于所有班，本场号码上限见教师设置。</p><h3>下一句</h3><p>接下来先做观察员。</p></article><article id=\"p7\"><h2>第7页 · 三件物品，三种用途</h2><p><a href=\"#p7\" data-offline-theme=\"red\" data-offline-page=\"7\">红版</a> / <a href=\"#p7\" data-offline-theme=\"blue\" data-offline-page=\"7\">蓝版</a> · 9—10分钟</p><h3>学生动作</h3><p>你准备把哪一件介绍给别人？</p><h3>点击顺序</h3><p>点击一个物品看用途；返回三物；说一个自己的使用场景。</p><h3>教师组织</h3><p>现场有实物时优先拿出实物；目前课件使用清楚标注的类别示意。先不公布参考理由，避免孩子照搬老师答案。</p><h3>回应纠错</h3><p>只需选一个练习对象，不是提前锁定竞拍资格。</p><h3>下一句</h3><p>看得具体，才能说得具体。</p></article><article id=\"p8\"><h2>第8页 · 先看见，再下结论</h2><p><a href=\"#p8\" data-offline-theme=\"red\" data-offline-page=\"8\">红版</a> / <a href=\"#p8\" data-offline-theme=\"blue\" data-offline-page=\"8\">蓝版</a> · 10—13分钟</p><h3>学生动作</h3><p>点开一个问题，补上你看到的细节。</p><h3>点击顺序</h3><p>按名字、特点、用途点击；先指物再说，随后揭示支架；可重新观察。</p><h3>教师组织</h3><p>按“名字—特点—用途”逐次点开问题。孩子先指认再说，老师一次只追问一个细节；无法验证的功能说“我们还要核实”。</p><h3>回应纠错</h3><p>把“很厉害”接成“哪一个地方让你这样想？”</p><h3>下一句</h3><p>把看见的细节，接到自己的理由后面。</p></article><article id=\"p9\"><h2>第9页 · 把“因为”后面写完整</h2><p><a href=\"#p9\" data-offline-theme=\"red\" data-offline-page=\"9\">红版</a> / <a href=\"#p9\" data-offline-theme=\"blue\" data-offline-page=\"9\">蓝版</a> · 13—16分钟</p><h3>学生动作</h3><p>你可以口头说，也可以把一句理由记在这里。</p><h3>点击顺序</h3><p>输入或口头说理由；点时间、动作、需要提示；最后用自己的细节再说一次。</p><h3>教师组织</h3><p>老师或孩子录入一句练习表达；工具只给追问，不作AI评分。低龄先指物、说名，再由老师问“你想怎样用它”。</p><h3>回应纠错</h3><p>没有自动对错分；教师根据现场回答选择一个追问。</p><h3>下一句</h3><p>给同伴听，再说第二次。</p></article><article id=\"p10\"><h2>第10页 · 两个人，都有麦克风时间</h2><p><a href=\"#p10\" data-offline-theme=\"red\" data-offline-page=\"10\">红版</a> / <a href=\"#p10\" data-offline-theme=\"blue\" data-offline-page=\"10\">蓝版</a> · 16—19分钟</p><h3>学生动作</h3><p>30秒说理由，30秒复述，再交换。</p><h3>点击顺序</h3><p>A说30秒，B复述30秒；计时可暂停；手动交换角色，再做一轮。</p><h3>教师组织</h3><p>按座位两人配对。计时只提醒不判输赢，不自动换页；必要时暂停。老师先照顾安静孩子，给句首，不代答。</p><h3>回应纠错</h3><p>每人至少一次表达和一次倾听；只记录观察到的表现。</p><h3>下一句</h3><p>小潘听过大家的理由，想法变了。</p></article><article id=\"p11\"><h2>第11页 · 改变主意，也可以有理由</h2><p><a href=\"#p11\" data-offline-theme=\"red\" data-offline-page=\"11\">红版</a> / <a href=\"#p11\" data-offline-theme=\"blue\" data-offline-page=\"11\">蓝版</a> · 19—20分钟</p><h3>学生动作</h3><p>你认为小潘改变了什么？什么没有变？</p><h3>点击顺序</h3><p>先说原来为什么选；点开现在的新信息；解释改变或维持的理由。</p><h3>教师组织</h3><p>这段故事延续同一人物和物件。不评价“买本子就比买彩铅好”，引导孩子说信息如何影响决定。</p><h3>回应纠错</h3><p>选择变了，仍需说清自己的理由。保持原决定也可以。</p><h3>下一句</h3><p>把自己的计划先记下来。</p></article><article id=\"p12\"><h2>第12页 · 预算，是提醒自己的计划</h2><p><a href=\"#p12\" data-offline-theme=\"red\" data-offline-page=\"12\">红版</a> / <a href=\"#p12\" data-offline-theme=\"blue\" data-offline-page=\"12\">蓝版</a> · 20—22分钟</p><h3>学生动作</h3><p>如果还有余额，你就必须继续吗？</p><h3>点击顺序</h3><p>拖动个人上限；先预计35报价是否超过计划，再点核对；重置可回30。</p><h3>教师组织</h3><p>屏幕100为练习算例，并非每人统一获得。实际积分=9月出勤次数×10+9月全勤奖励10（符合才加）+10月出勤次数×10+10月全勤奖励10（符合才加），10月30日前完成统计。剩分保留；150只是配券备量，不是个人积分。个人愿付上限仍可低于规则上限。</p><h3>回应纠错</h3><p>足够支付并不代表必须购买，个人计划可以不同。</p><h3>下一句</h3><p>正式成交后，要马上支付自己的积分币。</p></article><article id=\"p13\"><h2>第13页 · 成交后，马上支付积分币</h2><p><a href=\"#p13\" data-offline-theme=\"red\" data-offline-page=\"13\">红版</a> / <a href=\"#p13\" data-offline-theme=\"blue\" data-offline-page=\"13\">蓝版</a> · 22—24分钟</p><h3>学生动作</h3><p>请用练习币走一遍：点清 → 付款 → 核对。</p><h3>点击顺序</h3><p>从100积分的练习币里选出35再确认；少付或多付保留选择并给差额；准确付款后核对剩65；可重试。</p><h3>教师组织</h3><p>100−35=65仅是付款练习，不能替代实际积分。准备每人10分券10张、5分券8张、1分券10张，合计150分28张是备量，按实得积分组合发放，剩分保留。成交后本人当场付款，双方点清、核对后登记领取；试拍不扣正式积分。</p><h3>回应纠错</h3><p>核对的是实付数量、成交价和剩余币是否一致。发现不一致先暂停、当面复点；不让孩子承担登记错误。</p><h3>下一句</h3><p>下一题，手里的积分币不够怎么办？</p></article><article id=\"p14\"><h2>第14页 · 20，能报25吗？</h2><p><a href=\"#p14\" data-offline-theme=\"red\" data-offline-page=\"14\">红版</a> / <a href=\"#p14\" data-offline-theme=\"blue\" data-offline-page=\"14\">蓝版</a> · 24—26分钟</p><h3>学生动作</h3><p>选择一个动作，再说明原因。</p><h3>点击顺序</h3><p>对照20余额与25报价；选一项，再看差额5和追问；重试允许修正。</p><h3>教师组织</h3><p>这题有数值限制。点“继续”需解释差额5并提供重试；停止和核对都可成立。不同于个人偏好题。</p><h3>回应纠错</h3><p>先查清20与25；不能借别人的币，也不能让家长补钱。</p><h3>下一句</h3><p>如果余额够，还能停吗？</p></article><article id=\"p15\"><h2>第15页 · 够支付，也能说“停”</h2><p><a href=\"#p15\" data-offline-theme=\"red\" data-offline-page=\"15\">红版</a> / <a href=\"#p15\" data-offline-theme=\"blue\" data-offline-page=\"15\">蓝版</a> · 26—28分钟</p><h3>学生动作</h3><p>这里没有唯一的个人选择。关键是理由。</p><h3>点击顺序</h3><p>同时看40余额、30报价、25原计划；停或继续都需自己的理由。</p><h3>教师组织</h3><p>先给5秒静想，点选只展示追问，不出现勾叉排名。若改变预算，必须仍在余额和本场上限内。</p><h3>回应纠错</h3><p>继续要有新考虑；停止同样成立；问清信息也是一步。</p><h3>下一句</h3><p>写下你的个人计划。</p></article><article id=\"p16\"><h2>第16页 · 我的选择卡</h2><p><a href=\"#p16\" data-offline-theme=\"red\" data-offline-page=\"16\">红版</a> / <a href=\"#p16\" data-offline-theme=\"blue\" data-offline-page=\"16\">蓝版</a> · 28—31分钟</p><h3>学生动作</h3><p>先填卡，再跟同伴解释一次。</p><h3>点击顺序</h3><p>填写选择、理由、上限；点核对；输入仅保留本机，不录真实积分。</p><h3>教师组织</h3><p>个人愿付上限可填0至100，仍不得超过所拍档位封顶和本人实际余额。可低于任何上限；先表达需要，家长不代选。</p><h3>回应纠错</h3><p>上限低于或等于本场上限及余额；选择可以后来改变，但要说明原因。</p><h3>下一句</h3><p>把个人计划放进统一规则里。</p></article><article id=\"p17\"><h2>第17页 · 先把规则说清楚</h2><p><a href=\"#p17\" data-offline-theme=\"red\" data-offline-page=\"17\">红版</a> / <a href=\"#p17\" data-offline-theme=\"blue\" data-offline-page=\"17\">蓝版</a> · 31—33分钟</p><h3>学生动作</h3><p>请用自己的话，说出一条规则。</p><h3>点击顺序</h3><p>依次点击起拍、加价、封顶三组；读出本档封顶，再让孩子复述最多2份、剩分保留。</p><h3>教师组织</h3><p>低/中/高档1/5/10起拍，+2，50/80/100封顶；低中最后+1到封顶。每人跨档最多2份。封顶先喊出者得；听不清先停，不自动抽签。流拍二轮统一5起拍，再流拍收回。100只作练习，150只作券料，实际按9/10月出勤及月全勤奖励统计，剩分保留。</p><h3>回应纠错</h3><p>不以关注转发、续费金额或家长代答增加竞拍优势。</p><h3>下一句</h3><p>把举牌的话说完整。</p></article><article id=\"p18\"><h2>第18页 · 替主持人修一句话</h2><p><a href=\"#p18\" data-offline-theme=\"red\" data-offline-page=\"18\">红版</a> / <a href=\"#p18\" data-offline-theme=\"blue\" data-offline-page=\"18\">蓝版</a> · 33—35分钟</p><h3>学生动作</h3><p>每找到一个缺项，就点开一张提示。</p><h3>点击顺序</h3><p>先听抢喊原句；逐次补号码、报价、等待确认；重置后让孩子自己说。</p><h3>教师组织</h3><p>老师先故意说一次模糊报价，孩子指出缺项再点。不要一次把答案全显示。理由放在表达时段，不要求每次加价都讲长稿。</p><h3>回应纠错</h3><p>可修成“我是03号，我出30积分”。此处30按高档报价练习。</p><h3>下一句</h3><p>你来报一次，主持人复述一次。</p></article><article id=\"p19\"><h2>第19页 · 牌号＋报价，让别人听清</h2><p><a href=\"#p19\" data-offline-theme=\"red\" data-offline-page=\"19\">红版</a> / <a href=\"#p19\" data-offline-theme=\"blue\" data-offline-page=\"19\">蓝版</a> · 35—37分钟</p><h3>学生动作</h3><p>练习号牌和金额，再请同伴复述确认。</p><h3>点击顺序</h3><p>选择档位，修改练习编号和报价；非法范围可修正重试。</p><h3>教师组织</h3><p>练习先选低中高档，再报编号和金额；按本班1至N校验号码，按该档起拍、+2及末口到封顶校验。先报号码再由主持人复述确认。这里不记正式成交。</p><h3>回应纠错</h3><p>清晰比喊得大声更重要；听不清可以重报。</p><h3>下一句</h3><p>把一轮竞拍排成正确顺序。</p></article><article id=\"p20\"><h2>第20页 · 先做哪一步？</h2><p><a href=\"#p20\" data-offline-theme=\"red\" data-offline-page=\"20\">红版</a> / <a href=\"#p20\" data-offline-theme=\"blue\" data-offline-page=\"20\">蓝版</a> · 37—39分钟</p><h3>学生动作</h3><p>排完点“核对”；错了可以重排。</p><h3>点击顺序</h3><p>点步骤排到四格跑道；核对后用动作走一遍；清空可重排。</p><h3>教师组织</h3><p>核对余额与资格必须发生在落槌前；落槌后本人立即支付，登记老师点收、确认剩余币，完成登记再领取。四步中的末步包含付款与登记，不等到最后统一收费。</p><h3>回应纠错</h3><p>介绍 → 报价 → 核对 → 落槌、付款、登记领取。</p><h3>下一句</h3><p>试拍时，也可能有人停下来。</p></article><article id=\"p21\"><h2>第21页 · “我不拍了”，怎样接？</h2><p><a href=\"#p21\" data-offline-theme=\"red\" data-offline-page=\"21\">红版</a> / <a href=\"#p21\" data-offline-theme=\"blue\" data-offline-page=\"21\">蓝版</a> · 39—40分钟</p><h3>学生动作</h3><p>你想怎样回应同伴？</p><h3>点击顺序</h3><p>先读同伴原话；讨论怎样回应；点反馈后可返回改说法。</p><h3>教师组织</h3><p>先问孩子为什么这样选再点反馈。对不愿公开解释的孩子接受停止，课后单独支持，不逼问家庭经济或私事。</p><h3>回应纠错</h3><p>不把继续加价当勇敢，不把停下当失败。</p><h3>下一句</h3><p>遇到同价，也要按规则处理。</p></article><article id=\"p22\"><h2>第22页 · 同价时，不比谁嗓门大</h2><p><a href=\"#p22\" data-offline-theme=\"red\" data-offline-page=\"22\">红版</a> / <a href=\"#p22\" data-offline-theme=\"blue\" data-offline-page=\"22\">蓝版</a> · 40—41分钟</p><h3>学生动作</h3><p>同价时，主持人要先确认什么？</p><h3>点击顺序</h3><p>点击先核对、按办法、再登记；明确先喊出封顶价者得。</p><h3>教师组织</h3><p>封顶同价以最先喊出封顶价且资格有效者得，不以音量或表达评分决定。主持人听不清时先暂停核实，不由网页自动判断时间，不临时改为抽签。每人最多2份，未竞得不扣分。</p><h3>回应纠错</h3><p>未竞得者保留币，可继续后续类别；已竞得者改做介绍或提问。</p><h3>下一句</h3><p>先演练一轮，不扣真实积分。</p></article><article id=\"p23\"><h2>第23页 · 试拍一次，练会再开始</h2><p><a href=\"#p23\" data-offline-theme=\"red\" data-offline-page=\"23\">红版</a> / <a href=\"#p23\" data-offline-theme=\"blue\" data-offline-page=\"23\">蓝版</a> · 41—44分钟</p><h3>学生动作</h3><p>主持人，请复述报价，再核对。</p><h3>点击顺序</h3><p>先选择班场；报编号与金额，主持三句，再核对并模拟记录。支持撤销试拍上一笔。</p><h3>教师组织</h3><p>本页用100练习分走一轮低档报价。范围按本班人数，+2，49可+1到50，每人练习最多2份。主持口令三句后核对，再模拟付款。试拍不扣正式积分，试拍库存/余额/账本与正式完全隔离。</p><h3>回应纠错</h3><p>有错误先停下、说明、再试一次，不扣惩罚币。</p><h3>下一句</h3><p>现在喝口水，再把表达带入竞拍。</p></article><article id=\"p24\"><h2>第24页 · 喝口水，看看自己的计划</h2><p><a href=\"#p24\" data-offline-theme=\"red\" data-offline-page=\"24\">红版</a> / <a href=\"#p24\" data-offline-theme=\"blue\" data-offline-page=\"24\">蓝版</a> · 44—47分钟</p><h3>学生动作</h3><p>休息结束，再决定下一步。</p><h3>点击顺序</h3><p>启动休息计时；看看自己的选择卡；需要帮助时先暂停，不自动翻页。</p><h3>教师组织</h3><p>四分钟含饮水、回座与核对。计时器只提示不自动跳页或落槌，孩子需要时暂停。教师检查台账，不趁休息加讲新概念。</p><h3>回应纠错</h3><p>安静或情绪紧张的孩子可以稍作调节，不用新奖品诱导继续。</p><h3>下一句</h3><p>第一类拍品，先听介绍。</p></article><article id=\"p25\"><h2>第25页 · 正式拍卖｜把理由讲清楚</h2><p><a href=\"#p25\" data-offline-theme=\"red\" data-offline-page=\"25\">红版</a> / <a href=\"#p25\" data-offline-theme=\"blue\" data-offline-page=\"25\">蓝版</a> · 47—72分钟</p><h3>学生动作</h3><p>介绍员先说用途，其他人听完再举牌。</p><h3>点击顺序</h3><p>选择本班具体单件→介绍/提问→编号和报价→三句主持口令→若封顶核实先喊者→本人确认→点收实体券→记录；流拍按两轮处理，可撤销本班上一笔。</p><h3>教师组织</h3><p>正式25分钟：20件班约每件1分钟，另留5分钟核对；14件班可增加表达时间。提前摆好正式品，备用牙线/垃圾袋各1单放。3班美甲贴改1，5班14正式+2备用。8班9人最多成交18份，5班6人最多12份，未售不强迫成交，不突破每人2份。低/中/高档1/5/10起拍，+2，50/80/100封顶；低中最后+1到封顶。每人跨档最多2份。封顶先喊出者得；听不清先停，不自动抽签。流拍二轮统一5起拍，再流拍收回。100只作练习，150只作券料，实际按9/10月出勤及月全勤奖励统计，剩分保留。 每位初始积分须在设置录入真实核定值，空白不等于100或150。逐件选品，先介绍用途/权益具体内容，完整走主持口令，封顶手动核实先喊者，实体券当面点收后再记录。首轮流拍进入二轮5分，再流拍收回。库存、积分、限得按班分开；撤销恢复对应余额与该件状态。网页不自动收付，也不承诺权益使用期限。</p><h3>回应纠错</h3><p>避免所有时间只听活跃孩子；未竞价者可做提问者。</p><h3>下一句</h3><p>每笔当场付款，再共同核对记录。</p></article><article id=\"p26\"><h2>第26页 · 付完积分币，再核对记录</h2><p><a href=\"#p26\" data-offline-theme=\"red\" data-offline-page=\"26\">红版</a> / <a href=\"#p26\" data-offline-theme=\"blue\" data-offline-page=\"26\">蓝版</a> · 72—74分钟</p><h3>学生动作</h3><p>每笔成交当场支付；有出入，先暂停领取、一起复点。</p><h3>点击顺序</h3><p>核对最近6笔本班记录，查看剩分和累计份数；设置可查看全部并下载本班备份。</p><h3>教师组织</h3><p>只显示本班正式登记，试拍不混入。按编号、拍品、成交实付、当前余额和累计竞得数核对。每笔须先点收实体券再记录，不能到本页才付款。可在设置下载本班备份；清理浏览器或换设备不会自动同步。剩余积分保留。</p><h3>回应纠错</h3><p>个人初始积分为实际核定值；100−35=65只作练习，不当作本班记录。</p><h3>下一句</h3><p>东西可以不同，理由都值得听。</p></article><article id=\"p27\"><h2>第27页 · 先复述，再提问</h2><p><a href=\"#p27\" data-offline-theme=\"red\" data-offline-page=\"27\">红版</a> / <a href=\"#p27\" data-offline-theme=\"blue\" data-offline-page=\"27\">蓝版</a> · 74—76分钟</p><h3>学生动作</h3><p>先等同伴确认，再问你的问题。</p><h3>点击顺序</h3><p>先听原话，点开始复述；手动等对方回应，再进入说者确认、相关追问；可收起重来。</p><h3>教师组织</h3><p>同伴先说20—30秒，倾听者复述一个意思。说话者可纠正，确认后再点开提问示例。不要把教师复述替代孩子倾听。</p><h3>回应纠错</h3><p>提问跟对方理由有关，不考倒对方。</p><h3>下一句</h3><p>哪一个问题，能帮助你听明白？</p></article><article id=\"p28\"><h2>第28页 · 好问题，接着对方的话</h2><p><a href=\"#p28\" data-offline-theme=\"red\" data-offline-page=\"28\">红版</a> / <a href=\"#p28\" data-offline-theme=\"blue\" data-offline-page=\"28\">蓝版</a> · 76—78分钟</p><h3>学生动作</h3><p>选一个问题，再试着问出来。</p><h3>点击顺序</h3><p>读同伴原话再选追问；先口头讨论再揭示反馈；返回重试。</p><h3>教师组织</h3><p>先让同伴讨论，老师点击反馈。围绕用途与个人计划继续，而不是把“贵”或“赢”设成唯一价值。</p><h3>回应纠错</h3><p>问题是否相关可讨论，不给孩子贴会/不会听的标签。</p><h3>下一句</h3><p>把“说—听—问—答”走完整。</p></article><article id=\"p29\"><h2>第29页 · 交换一次，听见两个人</h2><p><a href=\"#p29\" data-offline-theme=\"red\" data-offline-page=\"29\">红版</a> / <a href=\"#p29\" data-offline-theme=\"blue\" data-offline-page=\"29\">蓝版</a> · 78—81分钟</p><h3>学生动作</h3><p>每人都完成一次说、听、问、答。</p><h3>点击顺序</h3><p>A说、B复述、A确认、B问、A答；90秒提醒；手动交换角色再完成一轮。</p><h3>教师组织</h3><p>给每组完整轮换，不只请代表上台。教师巡视记一句真实原话，基础弱孩子可先用一个词或指物，不连续追问三四次。</p><h3>回应纠错</h3><p>老师一次给一个建议，例如“先复述用途，再问什么时候使用”。</p><h3>下一句</h3><p>回头看看，最初的计划还一样吗？</p></article><article id=\"p30\"><h2>第30页 · 我的选择，前后有什么不同？</h2><p><a href=\"#p30\" data-offline-theme=\"red\" data-offline-page=\"30\">红版</a> / <a href=\"#p30\" data-offline-theme=\"blue\" data-offline-page=\"30\">蓝版</a> · 81—84分钟</p><h3>学生动作</h3><p>对家长或同伴，解释一个真实决定。</p><h3>点击顺序</h3><p>对照先前选择和现在决定；写一个真实理由；维持原计划也成立。</p><h3>教师组织</h3><p>拿出课前选择卡，与现在对照。没有拍中也能讲停止或观察的理由；不把所有变化都写成进步。家长先听再复述。</p><h3>回应纠错</h3><p>只记事实：孩子补了什么信息、怎样解释、怎样回应。</p><h3>下一句</h3><p>把一个具体进步说给孩子听。</p></article><article id=\"p31\"><h2>第31页 · 今天，我听见了什么？</h2><p><a href=\"#p31\" data-offline-theme=\"red\" data-offline-page=\"31\">红版</a> / <a href=\"#p31\" data-offline-theme=\"blue\" data-offline-page=\"31\">蓝版</a> · 84—86分钟</p><h3>学生动作</h3><p>请选择一个你确实观察到的表现。</p><h3>点击顺序</h3><p>先说观察到的原话；逐步展开具体表现与一个下一步建议；不评价输赢。</p><h3>教师组织</h3><p>教师按钮展示的是反馈句框，不是自动判定。没有观察证据就不套用；公开只选少量例子，其他孩子用反馈卡补齐。</p><h3>回应纠错</h3><p>反馈落到用途、理由、复述或决定，不统一写“都很棒”。</p><h3>下一句</h3><p>把这个动作带回家。</p></article><article id=\"p32\"><h2>第32页 · 回家，再做一次自己的选择</h2><p><a href=\"#p32\" data-offline-theme=\"red\" data-offline-page=\"32\">红版</a> / <a href=\"#p32\" data-offline-theme=\"blue\" data-offline-page=\"32\">蓝版</a> · 86—88分钟</p><h3>学生动作</h3><p>家长只问一个问题，把回答留给孩子。</p><h3>点击顺序</h3><p>切换三档任务；按能力选一档；录制前先说一遍，不照背方法示例。</p><h3>教师组织</h3><p>三档按实际表达能力选，不按红蓝风格分层。提交方式/截止/反馈时间由当班老师填写；不要求公开发布视频。示例台词可看，但不能逐字照背。</p><h3>回应纠错</h3><p>允许停顿与口头补交，是否可补交按本班实际安排。</p><h3>下一句</h3><p>最后，把选择与声音带走。</p></article><article id=\"p33\"><h2>第33页 · 有声，\n有主见</h2><p><a href=\"#p33\" data-offline-theme=\"red\" data-offline-page=\"33\">红版</a> / <a href=\"#p33\" data-offline-theme=\"blue\" data-offline-page=\"33\">蓝版</a> · 88—90分钟</p><h3>学生动作</h3><p>把一句自己的理由，留在今天。</p><h3>点击顺序</h3><p>请孩子补一句今天自己的决定；回应具体理由；不按竞得数量评表现。</p><h3>教师组织</h3><p>收回工具，确认领取与离场安排。合影自愿且按既有影像权限，不只展示竞得者；安排下一步家长反馈，不现场承诺长期能力变化。</p><h3>回应纠错</h3><p>尊重每个孩子不同的决定。</p><h3>下一句</h3><p>课程结束，保留观察，继续练习。</p></article></main>";window.OFFLINE_HELP="<div class=\"offline-help\"><h2>人生拍卖会 · 离线完整授课</h2><p>教师反馈R5：33页/90分钟，7场69人，已更新逐班拍品与竞拍规则。当前文件同时包含红蓝两版，内容相同，任选一版授课。</p><p><button data-offline-theme=\"red\">使用红版</button><button data-offline-theme=\"blue\">使用蓝版</button><button data-offline-action=\"guide\">逐页授课流程</button></p><ol><li>把这个HTML文件保存在电脑，用Chrome、Edge、Safari或Firefox打开，无需登录。首选你已经检查过的浏览器。</li><li>用底部左右箭头翻教学页；页面里的返回、收起、重试各有自己的动作，不会当作下一页。</li><li>点击“全屏授课”进入浏览器真正全屏；底部有上一页、页码、下一页和退出全屏，键盘左右键也可翻教学页，Esc退出并恢复备课工具。</li><li>选币、算币、计时、排序和竞拍记账都在本机运行。输入框内的左右键用于编辑文字，不会翻页。</li><li>先打开“老师先看这里”选择班场，按号码录入已核定积分；150只作配券备量、100只作练习。第25页按本班正式拍品和规则执行，第23页独立试拍。</li><li>练习、核定积分和本班登记仅保存在当前电脑、当前浏览器；不会自动发送或云端同步。清理浏览器数据或移动文件可能影响本机草稿，重要内容请另行保留。</li></ol><p>纸质或实体积分才是现场收付依据；第25页先当面点收实体券，再点击确认记录；网页不自动收款，设置里可下载本班备份。不要在练习区填写孩子隐私。</p><p>若使用微信收到文件，请先下载到电脑，再用浏览器打开，不用微信内置预览或Keynote打开HTML。</p></div>";</script><script>
(()=>{
 const dialog=document.querySelector('#offline-dialog'),content=document.querySelector('#offline-dialog-content');
 const close=()=>{if(dialog.open)dialog.close()};
 const root=document.documentElement,notice=document.querySelector('#fullscreen-notice');
 const isFullscreen=()=>Boolean(document.fullscreenElement||document.webkitFullscreenElement);
 const fit=()=>{window.dispatchEvent(new Event('resize'));requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')))};
 const updateNavigation=()=>{
  const n=window.COURSE_APP.getState().page,total=window.COURSE.pages.length;
  document.querySelector('#fullscreen-counter').textContent=n+' / '+total;
  document.querySelector('#fullscreen-controls [data-action="prev"]').disabled=n===1;
  document.querySelector('#fullscreen-controls [data-action="next"]').disabled=n===total;
 };
 function syncFullscreen(){document.body.classList.toggle('present',isFullscreen());notice.textContent='';fit();updateNavigation()}
 async function enterFullscreen(){
  notice.textContent='';
  try{
   const request=root.requestFullscreen||root.webkitRequestFullscreen;
   if(!request)throw new Error('fullscreen unavailable');
   await request.call(root);fit();
  }catch{
   notice.textContent=/Mac|iPhone|iPad/.test(navigator.platform)?'浏览器未允许全屏，请按 Control＋Command＋F；Esc返回备课。':'浏览器未允许全屏，请按 F11；Esc返回备课。';
   fit();
  }
 }
 async function exitFullscreen(){
  try{if(isFullscreen()){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document)}}
  catch{notice.textContent='请按Esc退出全屏。';return;}
  document.body.classList.remove('present');notice.textContent='';fit();
 }
 document.addEventListener('fullscreenchange',syncFullscreen);
 document.addEventListener('webkitfullscreenchange',syncFullscreen);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.open)exitFullscreen()});
 new MutationObserver(updateNavigation).observe(document.querySelector('#page-tabs'),{childList:true,subtree:true,characterData:true});
 updateNavigation();
 function switchTheme(t,page){
  if(t===document.documentElement.dataset.theme){close();if(page)window.COURSE_APP.go(Number(page));return;}
  try{sessionStorage.setItem('pan-offline-theme-r3',t)}catch{}
  if(page)history.replaceState(null,'','#p'+page);
  location.reload();
 }
 function show(kind){
  document.querySelector('#offline-dialog-title').textContent=kind==='guide'?'逐页授课与点击流程 · 离线':'使用说明 · 离线';
  content.innerHTML='';
  if(kind==='guide'){
   const frame=document.createElement('iframe');frame.title='逐页授课流程';frame.srcdoc=window.OFFLINE_GUIDE;
   frame.addEventListener('load',()=>frame.contentDocument.addEventListener('click',e=>{
    const a=e.target.closest('a');if(!a)return;e.preventDefault();
    if(a.dataset.offlinePage)switchTheme(a.dataset.offlineTheme,a.dataset.offlinePage);else close();
   }));content.append(frame);content.style.height='calc(100% - 54px)';
  }else{content.innerHTML=window.OFFLINE_HELP;content.style.height='calc(100% - 54px)';content.style.overflow='auto';}
  if(!dialog.open)dialog.showModal();
 }
 document.addEventListener('click',e=>{
  if(e.target.closest('[data-action="present"]')){enterFullscreen();return;}
  const t=e.target.closest('[data-offline-theme]');if(t){e.preventDefault();switchTheme(t.dataset.offlineTheme);return;}
  const a=e.target.closest('[data-offline-action]');
  if(a){e.preventDefault();if(a.dataset.offlineAction==='close')close();else if(a.dataset.offlineAction==='exit-fullscreen')exitFullscreen();else show(a.dataset.offlineAction);return;}
  const link=e.target.closest('#theme-link');if(link){e.preventDefault();switchTheme(document.documentElement.dataset.theme==='red'?'blue':'red');}
 },true);
 document.addEventListener('keydown',e=>{if(dialog.open){if(e.key==='Escape')close();e.stopImmediatePropagation();}},true);
 const theme=document.documentElement.dataset.theme;
 document.querySelector('#theme-link').textContent=theme==='red'?'换蓝版 ↗':'换红版 ↗';
 document.querySelector('#controls .version').textContent='人生拍卖会 · 教师反馈R5 · '+(theme==='red'?'红版':'蓝版');
 window.OFFLINE_HELPER={show,close};
})();
</script></body></html>
