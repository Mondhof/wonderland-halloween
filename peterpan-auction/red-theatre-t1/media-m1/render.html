<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>人生拍卖会媒体图形源</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:"PingFang SC","Microsoft YaHei",sans-serif}#art{position:relative;overflow:hidden}.cover{background:radial-gradient(ellipse at 20% 8%,#98151888,transparent 55%),linear-gradient(112deg,#490408,#800b10 65%,#54060b);color:#fae7c1}.brand{position:absolute;display:block;height:auto;opacity:1;z-index:5}.hero{position:absolute;height:auto;z-index:3;mix-blend-mode:screen}.scene{position:absolute;left:0;width:100%;overflow:hidden;z-index:1;mask-image:linear-gradient(transparent,black 17%,black 74%,transparent)}.scene img{position:absolute;display:block;height:auto}.scene.mic img{width:2200px;right:0;top:-250px}.scene.gavel img{width:1080px;left:0;top:-974px}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#63070d99,transparent 25%,transparent 90%,#63070d55)}.slogan{position:absolute;z-index:4;font:italic 900 72px/1.12 "Songti SC","STSong",serif;color:#fff0cd;letter-spacing:-1px;margin:0;white-space:nowrap}.english{position:absolute;z-index:4;font:italic 53px/1.18 Georgia,"Times New Roman",serif;color:#f9e5bc;white-space:nowrap}.date{position:absolute;z-index:4;font:700 40px/1.2 "Bodoni 72","Didot",serif;color:#e7c68e;white-space:nowrap}.notice{position:absolute;z-index:4;font-size:27px;line-height:1.4;color:#f4dcb3;white-space:nowrap}.eyebrow{position:absolute;z-index:4;right:64px;top:65px;font-size:22px;letter-spacing:4px;color:#d8b785}.props{position:absolute;left:70px;width:940px;height:380px;z-index:2}.props img{position:absolute;height:auto;box-shadow:0 15px 32px #21000499}.props .paddle{width:445px;left:5px;top:35px;transform:rotate(-6deg)}.props .coin10{width:290px;left:480px;top:25px;transform:rotate(-3deg)}.props .coin5{width:290px;left:535px;top:104px;transform:rotate(3deg)}.props .coin1{width:290px;left:595px;top:181px;transform:rotate(7deg)}
.theme-lockup{width:1600px;height:340px;padding:30px 45px;display:flex;flex-direction:column;justify-content:center;text-align:right;overflow:hidden}.theme-word{font:italic 900 164px/1.18 "Songti SC","STSong",serif;white-space:nowrap;letter-spacing:-3px}.theme-en{font:italic 53px/1.3 Georgia,"Times New Roman",serif;white-space:nowrap}.theme-light{color:#f8e3b9}.theme-dark{color:#81090c}.theme-dark .theme-en{color:#4c2b2b}.frame{background:transparent}.corner{position:absolute;height:auto;opacity:1;display:block}.frame-light .corner{filter:drop-shadow(0 2px 3px #0007)}.frame-dark .corner{filter:drop-shadow(0 1px 2px #fffe)}
</style><script src="spec.js"></script></head><body><main id="art"></main><script>
const q=new URLSearchParams(location.search),mode=q.get('mode')||'cover',art=document.getElementById('art'),v=q.get('variant')||'light';
function image(src,cls,style,alt){const e=document.createElement('img');e.src=src;e.className=cls;e.alt=alt;Object.assign(e.style,style);return e}
function block(cls,text,style){const e=document.createElement('div');e.className=cls;e.innerHTML=text;Object.assign(e.style,style);return e}
function size(w,h){art.style.width=w+'px';art.style.height=h+'px';document.documentElement.style.width=w+'px';document.documentElement.style.height=h+'px';}
if(mode==='theme'){
 size(1600,340);art.className='theme-lockup theme-'+v;art.innerHTML='<div class="theme-word">人生第一场拍卖会</div><div class="theme-en">Make a choice, Find your voice.</div>';
}else if(mode==='frame'){
 const f=MEDIA_SPEC.frames.find(x=>x.id===q.get('id'));size(f.width,f.height);art.className='frame frame-'+v;
 art.append(image('corners/品牌Logo_'+(v==='light'?'white':'color')+'_1473x372.png','corner brand-corner',{left:f.logo[0]+'px',top:f.logo[1]+'px',width:f.logo[2]+'px'},'完整彼得潘品牌Logo'));
 art.append(image('corners/课程主题_'+v+'_1600x340.png','corner theme-corner',{width:f.theme[0]+'px',right:f.theme[1]+'px',bottom:f.theme[2]+'px'},'人生第一场拍卖会主题角标'));
}else{
 const c=MEDIA_SPEC.covers.find(x=>x.id===(q.get('id')||'wx')),wide=c.id==='wide',h=c.height;size(c.width,h);art.className='cover';
 const portrait=h===1920,short=h===1260,heroW=wide?950:portrait?1000:short?790:895,heroTop=wide?117:portrait?135:short?105:114;
 art.append(image('../assets/logo-white.png','brand',{left:(wide?90:62)+'px',top:(wide?48:50)+'px',width:(wide?340:300)+'px'},'完整彼得潘品牌Logo'));
 art.append(image('../assets/title-wordmark.png','hero',{left:(wide?30:(1080-heroW)/2)+'px',top:heroTop+'px',width:heroW+'px'},'人生第一场拍卖会'));
 const sceneTop=wide?0:portrait?790:short?540:610,sceneH=wide?820:portrait?565:short?405:405;
 if(c.scene==='props'){
  const p=block('props','',{top:'650px'});for(const [n,cl]of [['paddle01','paddle'],['coin10','coin10'],['coin5','coin5'],['coin1','coin1']])p.append(image('assets/'+n+'.png',cl,{},'现行P2物料'));art.append(p);
 }else{const p=block('scene '+c.scene,'',{top:sceneTop+'px',height:sceneH+'px',...(wide?{left:'940px',width:'980px'}:{})});p.append(image('../assets/'+(c.scene==='mic'?'banner-base.png':'social1-base.png'),'',{},'已确认红幕剧场器物与舞台'));art.append(p);}
 const sloganTop=wide?735:portrait?1340:short?916:1050,sloganFont=wide?61:portrait?77:short?56:58;
 art.append(block('slogan',c.slogan.join('<br>'),{left:(wide?90:76)+'px',top:sloganTop+'px',fontSize:sloganFont+'px'}));
 const englishTop=wide?842:portrait?1563:short?1067:1190,englishFont=wide?42:portrait?53:short?35:43;
 art.append(block('english',wide?'Make a choice, Find your voice.':'Make a choice,<br>Find your voice.',{left:(wide?90:80)+'px',top:englishTop+'px',fontSize:englishFont+'px'}));
 art.append(block('date','2026.10.31—11.01',{left:(wide?90:80)+'px',top:(wide?980:portrait?1769:short?1169:1322)+'px',fontSize:(wide?43:portrait?40:short?32:34)+'px'}));
 art.append(block('notice','具体场次请看班级群内容通知',{left:(wide?600:80)+'px',top:(wide?989:portrait?1835:short?1216:1380)+'px',fontSize:(wide?29:portrait?27:short?21:22)+'px'}));
 art.append(block('eyebrow','活动预告',{}));
}
</script></body></html>
